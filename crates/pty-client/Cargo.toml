[package]
name = "pty-client"
description = "Typed client operations over a pty session's socket: list, attach, peek and screen reads, send, stats, signal, stop and remove, readiness, and the remote dial, each also against a registry root the caller names. No terminal emulator, no Zig."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# `AsyncConnection` — the tokio flavour of `SessionConnection`.
tokio = ["dep:tokio"]

[dependencies]
libc.workspace = true
pty-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.53", features = ["net", "io-util", "time", "rt"], optional = true }

[dev-dependencies]
pty-terminal = { path = "../pty-terminal" }
serde_json.workspace = true
tokio = { version = "1.53", features = ["net", "io-util", "time", "rt", "macros"] }
