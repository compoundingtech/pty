[package]
name = "pty-terminal"
description = "libghostty-backed terminal state for pty: bytes in; screen, cells, cursor, modes, graphics, input encoding, query answers and replay serialization out. Spawns no process."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
libghostty-vt.workspace = true
# Not used directly: it turns on pkg-config discovery of a prebuilt
# libghostty-vt for everything that depends on this crate. See the README,
# "Depending on pty-terminal or pty-testkit without Zig".
libghostty-vt-sys.workspace = true
png.workspace = true
pty-core = { path = "../pty-core" }
