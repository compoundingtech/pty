[package]
name = "pty"
description = "The pty binary: persistent terminal sessions hosted by a per-session daemon, driven from the command line. Its library is the TerminalHandle that spawns a child or attaches to a daemon."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[[bin]]
name = "pty"
path = "src/main.rs"

[dependencies]
pty-spawn = { path = "../pty-spawn" }
libc.workspace = true
libghostty-vt.workspace = true
portable-pty.workspace = true
pty-client.workspace = true
pty-core.workspace = true
pty-lifecycle.workspace = true
pty-terminal.workspace = true
pty-tui.workspace = true
serde.workspace = true
serde_json.workspace = true
signal-hook = "0.3.18"

[dev-dependencies]
pty-testkit.workspace = true
regex.workspace = true
serde_json.workspace = true
