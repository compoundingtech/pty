# Recorded divergences between the Node pty and pty-rust.
#
# `scripts/conformance-both.sh` runs the conformance suite against both
# binaries and writes the tests whose result differs.
# `scripts/check-divergences.py` compares that list against this file and
# fails when the two disagree, in EITHER direction:
#
#   * a divergence that is not recorded here — nobody has judged it;
#   * a record here that no longer happens — the entry has gone stale.
#
# The second rule is the one that keeps this file honest. A ledger that only
# grows becomes a list of claims nobody re-reads, and its entries outlive their
# reasons. Failing on a resolved entry forces this file to describe today.
#
# Fields:
#   test    `<conformance file>::<test name>`, as it appears in red.txt.
#   side    "node" = the test fails on the Node binary.
#           "rust" = it passes on Node and fails on pty-rust. Treat any new
#                    rust-red entry as a regression until proven otherwise.
#   kind    "intended"    — a difference we chose; point at its decision record.
#           "node-defect" — the Node reference is wrong and pty-rust is right.
#   reason  What differs, how it was measured, and why it is recorded and not
#           fixed here.
#
# TWO INPUTS DECIDE WHAT THIS FILE SHOULD SAY, AND BOTH ARE PINNED.
#
# The Node COMMIT is pinned in `node-ref`. A checkout seven commits behind
# invented eight divergences on 2026-09-05, every one an artifact.
#
# The Node RUNTIME is pinned in the workflow, and it matters just as much. This
# file first recorded the Node binary truncating `pty completions fish` on a
# pipe, 123 lines of 167. That was measured on x86_64 Linux with Node v24.18.0,
# where it reproduces every run. CI runs Node 22 and does not reproduce it at
# all: same commit, same test, different answer.
#
# The boundary is NOT simply the Node major, and it would be wrong to record it
# that way. The Node pty owner measured the same unfixed binary on arm64 macOS
# and got the full 12138 bytes under BOTH Node 22.21.1 and Node 24.0.2. So the
# unfixed failure depends on runtime, platform and scheduling together, and the
# only honest summary is that it does not reproduce in the environment this
# gate runs in.
#
# The defect is real: their forced delayed-write fixture, which does not rely
# on natural scheduling, prints zero bytes against the old exit path and the
# full 12138 against the fixed one, on Node 22 and 24 alike. A fix is in
# progress there. These entries were removed because a ledger records what CI
# can observe, not because the defect is not real.
#
# Measured against Node 86dcc5eb7bbca73ab9635ea07ab1018ec43ede61 on Node 22,
# 2026-09-06: pty-rust 660/660, the Node pty 659/660.

[[divergence]]
test = "events::animated_titles_do_not_fill_event_history"
side = "node"
kind = "intended"
reason = """
Rust keeps the current OSC 0/2 title in terminal state and forwards the \
original output to attached clients, but no longer persists title_change \
records. Animated titles are redraw state, not durable session facts; \
writing every spinner frame replaces the event log and evicts useful \
history. The pinned Node daemon still persists distinct title frames. \
The fixture emits 40 animated OSC 0 titles, a final OSC 2 title and a BEL \
processing barrier, then requires no title_change record. Old title records \
remain readable and formattable. Remove this entry when Node stops \
persisting titles, or if Rust resumes it.
"""

[[divergence]]
test = "events::cursor_redraws_do_not_fill_event_history"
side = "node"
kind = "intended"
reason = """
pty-rust daemons no longer write `cursor_visible` records \
(compoundingtech/pty#172). A TUI hides and restores the cursor on many \
frames, the terminal snapshot already carries cursor visibility, and those \
records evicted durable history from the retained log. Old records still \
parse and format. The fixture hides and shows the cursor twice, rings the \
bell, waits for the bell and then requires no `cursor_visible` record. \
Against pinned Node f005432ad5c73b79abd7c5eaa8a0d6eb66ee9194 on Node 22 in \
Linux CI run 39256826955, the Node daemon wrote them. The Node on-disk \
layout lists `cursor_visible` among the tier-1 event types, so this is a \
change to what the event log contains, not only to its volume. Remove this \
entry when Node stops persisting cursor restoration, or if Rust resumes it.
"""

[[divergence]]
test = "events::recent_type_filter_returns_every_retained_match_and_preserves_envelopes_order"
side = "node"
kind = "intended"
reason = """
pty-rust adds `events --recent --type <type>` for an exact, case-sensitive \
retained-event query. Measured against pinned Node 98e11c946f2aa90a10bdc235735e9a82e66158c4 \
on Node 22, the Node CLI does not recognize the option: it treats `--type` as \
the session reference and exits 1 with `Session "--type" not found.` Rust \
returns every matching envelope from the writer-bounded retained log in its \
original chronological order. The fixture proves old matches remain visible \
behind both 51 newer unrelated events and more than 50 newer matching events. \
Remove this entry when Node supports the same exact all-retained-match and \
empty-success semantics, or if Rust removes it.
"""

[[divergence]]
test = "gc::removes_only_dead_writer_atomic_temporaries"
side = "node"
kind = "intended"
reason = """
pty-rust `gc` removes atomic-write leftovers named \
`<target>.tmp.<pid>.<16 lowercase hex>` whose writer PID is dead, in the \
registry and its `.activity` and `.recovery` directories \
(compoundingtech/pty#172). Live or reused PIDs, malformed names, \
directories, symlinks and `gc --dry-run` leave them in place. Against \
pinned Node f005432ad5c73b79abd7c5eaa8a0d6eb66ee9194 on Node 22 in Linux \
CI run 39256826955, Node `gc` exited 0 and left the dead writer's \
temporary behind. The Node on-disk layout gives these files no tier and \
tells readers to ignore them, so collecting them changes nothing a reader \
sees. Remove this entry when Node collects the same leftovers, or if Rust \
stops.
"""

[[divergence]]
test = "gc::daemon_automatically_removes_only_dead_writer_atomic_temporaries"
side = "node"
kind = "intended"
reason = """
pty-rust daemons run the existing conservative dead-writer atomic-temp \
sweep on entering the serving loop and every 30 seconds thereafter, \
including while idle. This does not run full session GC or alter canonical \
event history. The fixture covers event-lock and event-log temporaries in \
the registry, `.activity`, and `.recovery`, preserving live writers, malformed \
names, directories and symlinks. The existing explicit-GC divergence above \
records that pinned Node leaves these ignored leftovers in place; automatic \
collection is Rust-specific too. Remove this entry when Node provides the \
same automatic cleanup, or if Rust removes it.
"""

[[divergence]]
test = "process_tree::kill_gives_a_foreground_job_time_to_handle_hangup"
side = "node"
kind = "node-defect"
reason = """
The foreground job traps HUP and TERM and records which signal reaches it. \
Against the pinned Node binary on Node 22 in CI, `pty kill` delivered TERM \
before the one-second hangup grace elapsed. Rust delivered HUP first or \
waited through the grace period before TERM. The foreground job should get \
a chance to handle terminal hangup before the stronger termination signal. \
Remove this entry if Node adopts the same grace period.
"""

[[divergence]]
test = "restart_env_scrub::restart_does_not_leak_the_restarters_identity"
side = "node"
kind = "node-defect"
reason = """
The pinned Node reference f005432ad5c73b79abd7c5eaa8a0d6eb66ee9194 predates \
AGENT_TRACE_FILE scrubbing. In CI, its restarted child inherits the \
restarter's trace path. Rust removes the ambient path, as it removes \
ST_AGENT and ST_ROOT, so the new process can use its own provenance file. \
Explicit persisted --env values remain unchanged. Remove this entry when \
Node removes the same ambient trace path on restart.
"""

[[divergence]]
test = "list_liveness_budget::eperm_on_kill_zero_does_not_prove_daemon_identity"
side = "node"
kind = "intended"
reason = """
PTY.REG-R09 and decision 0010 separate display status from owner identity. \
An unproven live PID remains running but must carry identity=unknown; EPERM \
from kill-zero cannot grant Match or signal authority. The Node reference \
does not expose this independent identity field. The shared case deliberately \
requires the Rust contract rather than accepting PID existence as identity.
"""

[[divergence]]
test = "list_liveness_budget::permission_denied_fleet_without_identity_is_listed_in_name_order"
side = "node"
kind = "intended"
reason = """
The shared case retains name ordering and requires running with identity=unknown \
for every unproven PID, as specified by PTY.REG-R09 and decision 0010. \
The Node reference has no independent identity field. Keep this divergence \
until it exposes Unknown separately without treating missing evidence as death.
"""

[[divergence]]
test = "list_liveness_budget::unreachable_fleet_waits_one_shared_deadline"
side = "node"
kind = "intended"
reason = """
The shared case retains its name-order and one-deadline timing assertions, \
and requires unidentified socket rows to carry running with identity=unknown \
under PTY.REG-R09 and decision 0010. The Node reference does not expose this \
identity field. Socket reachability never proves owner identity.
"""

[[divergence]]
test = "security_fixes::bounds_names_that_overflow_the_readable_socket_path"
side = "node"
kind = "intended"
reason = """
Decision 0018 (docs/decisions/0018-logical-session-ids-outlive-the-socket-budget.md) \
separates logical IDs from transport paths. Against pinned Node \
f005432ad5c73b79abd7c5eaa8a0d6eb66ee9194 on Node 22 in Linux CI run \
38629683921, the 100-character ID exits 1 because its readable socket path \
exceeds the limit. Rust starts the session with a bounded socket name, then \
kills it successfully. This is an intentional Rust extension, not a reason \
to restore rejection or change the Node reference here. Remove this entry \
when Node supports bounded socket names or Rust removes the extension.
"""

[[divergence]]
test = "socket_path_boundary::logical_id_longer_than_socket_budget_can_list_attach_query_and_stop"
side = "node"
kind = "intended"
reason = """
Decision 0018 (docs/decisions/0018-logical-session-ids-outlive-the-socket-budget.md) \
keeps the full logical ID while bounding its socket address. Against pinned \
Node f005432ad5c73b79abd7c5eaa8a0d6eb66ee9194 on Node 22 in Linux CI run \
38629683921, creation of the 120-character ID exits 1 with a socket path \
length error. Rust passes list, stats, protocol attach, kill and sidecar \
cleanup for that ID. The Node rejection is expected for this intentional \
Rust extension, so the reference is not changed here. Remove this entry \
when Node supports the same logical-ID behavior or Rust removes it.
"""

[[divergence]]
test = "socket_path_boundary::registry_sidecar_limit_accepts_boundary_and_rejects_overflow"
side = "node"
kind = "intended"
reason = """
Decision 0018 (docs/decisions/0018-logical-session-ids-outlive-the-socket-budget.md) \
uses the registry sidecar limit, not the readable socket path, to bound IDs. \
Against pinned Node f005432ad5c73b79abd7c5eaa8a0d6eb66ee9194 on Node 22 in \
Linux CI run 38629683921, creation of the 209-character boundary ID exits 1 \
with a socket path length error, before the overflow assertion is reached. \
Rust starts and kills that session, then rejects 210 characters with the \
registry-sidecar diagnostic and no metadata. This is the deliberate Rust \
boundary, not an assertion that Node accepted the overflow. The reference \
is not changed for this extension. Remove this entry when Node supports \
the same boundary behavior or Rust removes it.
"""
